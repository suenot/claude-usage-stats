services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: harness-analyzer-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      HOME: /data
      AUTH_ISSUER: auth.marketmaker.cc
      AUTH_JWKS_URL: https://auth.marketmaker.cc/.well-known/jwks.json
      AUTH_SERVICE_NAME: harness-analyzer
      CORS_ALLOWED_ORIGINS: https://harness-analyzer.marketmaker.cc,http://127.0.0.1:5173,http://localhost:5173
      DATABASE_URL: postgres://harness_analyzer:${HARNESS_DB_PASSWORD:?Set HARNESS_DB_PASSWORD}@harness-analyzer-db:5432/harness_analyzer
      SNAPSHOT_EXPORT_ENABLED: "false"
      SNAPSHOT_EXPORT_OWNER_SUBJECT: ${SNAPSHOT_EXPORT_OWNER_SUBJECT:-}
    depends_on:
      harness-analyzer-db:
        condition: service_healthy
    volumes:
      - ./data:/data/.claude-stats
    networks:
      - web
      - harness-internal

  harness-analyzer-db:
    image: postgres:16-alpine
    container_name: harness-analyzer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: harness_analyzer
      POSTGRES_USER: harness_analyzer
      POSTGRES_PASSWORD: ${HARNESS_DB_PASSWORD:?Set HARNESS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness_analyzer -d harness_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - harness-analyzer-postgres:/var/lib/postgresql/data
    networks:
      - harness-internal

networks:
  web:
    external: true
    name: web
  harness-internal:
    name: harness-analyzer-internal

volumes:
  harness-analyzer-postgres:
    name: harness-analyzer-postgres
